name: daily-news

on:
  schedule:
    - cron: "0 22 * * *" # 毎朝7:00 JST
  workflow_dispatch:

permissions:
  contents: write # sent.json をコミットするため

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
        run: python main.py --profile tech
      - name: Save sent URLs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent.json
          git diff --cached --quiet || (git commit -m "chore: update sent.json" && git pull --rebase origin main && git push)

  updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send product updates
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID_UPDATES: ${{ secrets.SLACK_CHANNEL_ID_UPDATES }}
        run: python main.py --profile updates
      - name: Save sent URLs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_updates.json
          git diff --cached --quiet || (git commit -m "chore: update sent_updates.json" && git pull --rebase origin main && git push)
